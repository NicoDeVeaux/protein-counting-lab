[project]
name = "protein-counting-lab"
version = "0.1.0"
description = "Exploratory, independently graded protein ensemble counting experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

